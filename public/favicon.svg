<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="46" fill="#0f172a" stroke="#00f0ff" stroke-width="2"/>
  <!-- Paper notebook fold -->
  <path d="M25 22 C25 20, 27 18, 30 18 L68 18 L80 30 L80 78 C80 80, 78 82, 75 82 L30 82 C27 82, 25 80, 25 78 Z" fill="url(#paperGrad)" stroke="#334155" stroke-width="2"/>
  <!-- Notebook grid lines -->
  <line x1="32" y1="34" x2="72" y2="34" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="32" y1="46" x2="72" y2="46" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="32" y1="58" x2="72" y2="58" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="32" y1="70" x2="72" y2="70" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Holographic AR Cube popping out -->
  <path d="M50 32 L68 42 L68 64 L50 74 L32 64 L32 42 Z" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="50" y1="53" x2="50" y2="74" stroke="#00f0ff" stroke-width="2"/>
  <line x1="50" y1="53" x2="68" y2="42" stroke="#00f0ff" stroke-width="2"/>
  <line x1="50" y1="53" x2="32" y2="42" stroke="#00f0ff" stroke-width="2"/>
  <!-- Glowing Spark/Vertex -->
  <circle cx="50" cy="53" r="3.5" fill="#ffffff" filter="url(#glow)"/>
</svg>
